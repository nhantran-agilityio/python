<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Report List</title>
</head>
<body>
    <h1>Report List</h1>
    <table>
        <thead>
            <tr>
                <th>Student</th>
                <th>Course</th>
                <th>Point</th>
                <th>Description</th>
                <th>Created At</th>
            </tr>
        </thead>
        <tbody>
            {% for report in reports %}
            <tr>
                <td>{{ report.student.full_name }}</td>
                <td>{{ report.course.name }}</td>
                <td>{{ report.point }}</td>
                <td>{{ report.description }}</td>
                <td>{{ report.created_at }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
