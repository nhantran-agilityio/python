{% extends "base_generic.html" %} {% block content %}
<h2>Notifications</h2>
<ul>
    {% for notification in notifications %}
    <li>
        {% if not notification.is_read %}
        <strong>{{ notification.message }}</strong>
        {% else %} {{ notification.message }} {% endif %}
        <small>{{ notification.created_at }}</small>
    </li>
    {% endfor %}
</ul>
{% endblock %}
