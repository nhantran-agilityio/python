[tool.poetry]
name = "human-resource"
version = "0.1.0"
description = "A comprehensive human resource management system built with Django."
authors = ["Nhan Tran <nhan.tran70495@gmail.com>"]
license = "MIT"
readme = "README.md"
packages = [
    { include = "src"}
]

[tool.poetry.dependencies]
python = "^3.12"
django = "^5.0.7"
djangorestframework = "3.15.2"
celery = "^5.3.0"
sentry-sdk = "^1.29.2"
psycopg2-binary = "^2.9.6"
split-settings = "^1.0.0"
dj-database-url = "^2.3.0"
dotenv = "^0.9.9"
django-allauth = "65.5.0"
django-celery-beat = "2.7.0"
django-cors-headers = "4.7.0"
django-debug-toolbar = "5.0.1"
django-extensions = "3.2.3"
django-filter = "25.1"
django-rest-auth = "0.9.5"
django-split-settings = "1.3.2"
django-timezone-field = "7.1"
djangorestframework-camel-case = "1.4.2"
djangorestframework-simplejwt = "5.2.2"
drf-spectacular = "0.28.0"
drf-yasg = "1.21.10"
et-xmlfile = "2.0.0"
filelock = "3.18.0"
gunicorn = "23.0.0"
html5lib = "1.1"
identify = "2.6.9"
idna = "3.10"
lxml = "5.3.1"
openpyxl = "3.1.5"
pandas = "2.2.3"
pillow = "11.1.0"
pre-commit = "4.1.0"
xhtml2pdf = "0.2.17"
whitenoise = "6.9.0"
wheel = "0.45.1"
certifi = "2025.1.31"
setuptools = "^78.1.0"

[tool.poetry.dev-dependencies]
pytest = "^7.4.0"
pytest-django = "^4.5.2"
coverage = "^7.3.1"
flake8 = "^6.1.0"
black = "^23.9.1"
isort = "^5.12.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
