target-version = "py313"

[project]
name = "django-practice"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "django-environ>=0.11.2",
    "django>=5.1.4",
    "djangorestframework>=3.15.2",
    "django-extensions>=3.2.3",
    "djangorestframework-camel-case==1.4.2",
    "django-storages==1.14.6",
    "boto3",
    "pandas==2.2.3",
    "openpyxl",
    "djangorestframework-simplejwt==5.2.2",
    "django-cors-headers==4.7.0",
    "django-filter==25.1",
    "dj-database-url==2.3.0",
    "packaging==24.2",
    "pillow==11.1.0",
    "psycopg2-binary==2.9.10",
    "python-dotenv==1.0.1",
    "PyYAML==6.0.2",
    "requests==2.32.3",
    "sentry-sdk==2.22.0",
    "sqlparse==0.5.3",
    "uritemplate==4.1.1",
    "urllib3==2.3.0",
    "whitenoise==6.9.0",
    "django-rest-auth==0.9.5",
    "Django==5.1.7",
    "django-allauth==65.5.0",
    "django-split-settings==1.3.2",
    "djangorestframework==3.15.2",
    "drf-yasg==1.21.10",
    "filelock==3.18.0",
    "gunicorn==23.0.0",
    "celery==5.4.0",
    "django-celery-beat==2.7.0",
    "setuptools==76.0.0",
    "reportlab==4.3.1",
    "asgiref==3.8.1",
    "certifi==2025.1.31",
    "cfgv==3.4.0",
    "charset-normalizer==3.4.1",
    "coreapi==2.3.3",
    "coreschema==0.0.4",
]

[dependency-groups]
dev = [
    "django-debug-toolbar>=4.4.6",
    "ruff>=0.8.2",
    "django-debug-toolbar==5.0.1",
    "flake8==7.1.2",
    "pre_commit==4.1.0",
    "pycodestyle==2.12.1",
    "pyflakes==3.2.0",
    "coverage==7.7.0",
]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
# Enable Pyflakes `E` and `F` codes by default.
select = ["E", "F"]
ignore = ["E501", "E741"]
